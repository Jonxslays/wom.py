[project]
name = "wom.py"
version = "3.3.0"
description = "An asynchronous wrapper for the Wise Old Man API."
authors = [{ name = "Jonxslays" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["aiohttp>3.8.1", "msgspec>=0.21.0"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/Jonxslays/wom.py"
Repository = "https://github.com/Jonxslays/wom.py"
Documentation = "https://jonxslays.github.io/wom.py"

[project.scripts]
wom = "wom.__main__:_main"

[dependency-groups]
dev = [
    "coverage==7.6.10",
    "griffe==0.47.0",
    "mike==2.0.0",
    "mkdocs-include-markdown-plugin==6.2.2",
    "mkdocs-material==9.5.50",
    "mkdocstrings[python]==0.27.0",
    "mypy==2.1.0",
    "nox==2024.10.9",
    "pyright==1.1.393",
    "pytest==8.3.4",
    "pytest-asyncio==0.25.3",
    "pytest-cov==6.0.0",
    "pytest-testdox==3.1.0",
    "ruff==0.14.4",
]

[tool.hatch.build.targets.wheel]
packages = ["wom"]

[tool.hatch.build.targets.sdist]
include = ["wom", "README.md", "LICENSE", "CHANGELOG.md"]

[tool.mypy]
packages = ["wom"]
strict = true

[tool.pyright]
include = ["wom"]
typeCheckingMode = "strict"
reportImportCycles = false

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.coverage.run]
omit = ["tests/*"]

[tool.ruff]
line-length = 99

[tool.ruff.lint]
# F4x: pyflakes import checks (unused / star imports). I: isort import sorting.
select = ["F4", "I"]
# Star imports are used intentionally for the flat top-level re-export surface.
ignore = ["F403", "F405"]

[tool.ruff.lint.isort]
force-single-line = true

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
