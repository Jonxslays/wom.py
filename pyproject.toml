[project]
name = "wom.py"
version = "3.2.1"
description = "An asynchronous wrapper for the Wise Old Man API."
authors = [{ name = "Jonxslays" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["aiohttp>3.8.1", "msgspec>=0.20.0"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/Jonxslays/wom.py"
Repository = "https://github.com/Jonxslays/wom.py"
Documentation = "https://jonxslays.github.io/wom.py"

[project.scripts]
wom = "wom.__main__:_main"

[dependency-groups]
dev = [
    "black==25.1.0",
    "coverage==7.6.10",
    "flake8==7.1.1",
    "griffe==0.47.0",
    "isort==6.0.0",
    "mike==2.0.0",
    "mkdocs-include-markdown-plugin==6.2.2",
    "mkdocs-material==9.5.50",
    "mkdocstrings[python]==0.27.0",
    "mypy==2.1.0",
    "nox==2024.10.9",
    "pyright==1.1.393",
    "pytest==8.3.4",
    "pytest-asyncio==0.25.3",
    "pytest-testdox==3.1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["wom"]

[tool.hatch.build.targets.sdist]
include = ["wom", "README.md", "LICENSE", "CHANGELOG.md"]

[tool.black]
line-length = 99

[tool.isort]
profile = "black"
force_single_line = true

[tool.mypy]
packages = ["wom"]
strict = true

[tool.pyright]
include = ["wom"]
typeCheckingMode = "strict"
reportImportCycles = false

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
ignore = ["F405", "F403"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
