name: Feature request
description: Suggest a new feature or improvement for wom.py.
labels: ["enhancement"]
body:
  - type: textarea
    id: description
    attributes:
      label: What would you like?
      description: |
        Describe the feature and the problem it solves. If it relates to a
        Wise Old Man API endpoint, link to it in the
        [API docs](https://docs.wiseoldman.net/).
    validations:
      required: true

  - type: textarea
    id: example
    attributes:
      label: Example usage
      description: How you would like to use the feature, if you have an idea.
      render: python
